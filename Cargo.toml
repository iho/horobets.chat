[workspace]
members = ["crates/shared-proto", "crates/server", "crates/client-core", "crates/desktop", "crates/mobile-core"]
resolver = "2"
exclude = ["vendor/gpui-component"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v7", "serde"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
